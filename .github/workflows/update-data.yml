name: Atualizar dados de mercado
on:
  schedule:
    - cron: "30 6 * * 1-5"   # dias úteis, 06:30 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node tests/plan.cjs
      - run: python fetch.py
      - run: python audit.py
      - name: Commit data.js
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Atualiza dados de mercado" && git push)
