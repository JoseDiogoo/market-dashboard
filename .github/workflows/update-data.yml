name: Atualizar dados de mercado
on:
  schedule:
    - cron: "30 6 * * 1-5"   # abertura da Europa
    - cron: "0 12 * * 1-5"   # meio do dia
    - cron: "30 16 * * 1-5"  # abertura dos EUA
    - cron: "45 21 * * 1-5"  # depois do fecho dos EUA
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: update-data   # nunca duas atualizações em simultâneo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        continue-on-error: true   # um teste de código partido não pode parar a atualização dos dados; o audit.py protege os dados
      - run: node tests/plan.cjs
        continue-on-error: true
      - run: node tests/simple.cjs
        continue-on-error: true
      - run: python fetch.py 2>&1 | tee run.log
      - run: python audit.py 2>&1 | tee -a run.log   # pipefail é o padrão no bash do Actions
      - name: Commit data.js
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Atualiza dados de mercado" && git pull --rebase -X theirs && git push)
      - name: Abrir issue se a atualização falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Ver $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo "Causa (linhas FALHA / erros / fim do log):"; echo '```'; grep -E "^FALHA|Traceback|Error" run.log | head -20 || true; echo ...; tail -15 run.log | cut -c1-300 || true; echo '```'; } > body.md
          gh issue create --title "Atualização de dados falhou ($(date -u +%F\ %H:%M) UTC)" --body-file body.md || true
