<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Investimento</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e8eaee;--t1:#111827;--t2:#4b5563;--mut:#6b7280;--em:#059669;--em-bg:#ecfdf5;--am:#b45309;--am-bg:#fffbeb;--bl:#2563eb;--bl-bg:#eff6ff;--rd:#dc2626;--rd-bg:#fef2f2;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t1);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header{display:flex;align-items:center;gap:14px;padding:18px 0;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}.brand span{color:var(--em)}
#q{flex:1;min-width:160px;max-width:340px;margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;outline:none}#q:focus{border-color:var(--bl);box-shadow:0 0 0 3px #2563eb22}
#live{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.hc{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px;cursor:pointer;border:1px solid transparent;transition:.15s}.hc:hover{border-color:var(--bl);transform:translateY(-1px)}
.hl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}.hc .tk{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.hc .big{font-size:15px;margin-top:6px;color:var(--t2)}.hc .big b{color:var(--em);font-size:18px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:600 14px system-ui;color:var(--t2);cursor:pointer;min-height:44px}.pill.on{background:var(--t1);color:#fff;border-color:var(--t1)}
select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:600 14px system-ui;color:var(--t2);min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px;cursor:pointer;border:1px solid transparent;transition:.15s}.card:hover{border-color:var(--bl);transform:translateY(-1px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.nm{font-weight:700;line-height:1.2}.sub{font-size:12px;color:var(--mut)}
.price{font-size:22px;font-weight:700;letter-spacing:-.01em}
.up{color:var(--em)}.dn{color:var(--rd)}
.chip{white-space:nowrap;display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}.chip.g{background:var(--em-bg);color:var(--em)}.chip.a{background:var(--am-bg);color:var(--am)}.chip.b{background:var(--bl-bg);color:var(--bl)}.chip.r{background:var(--rd-bg);color:var(--rd)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line);gap:10px}.kv span:first-child{color:var(--mut)}
.cb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin:6px 0}.cb i{display:block}
#ov{position:fixed;inset:0;background:#0f172a66;opacity:0;pointer-events:none;transition:.2s;z-index:40}#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--bg);z-index:50;transform:translateX(105%);transition:transform .25s;overflow-y:auto;box-shadow:-10px 0 40px #0003;-webkit-overflow-scrolling:touch}#dr.on{transform:none}
.dh{position:sticky;top:0;background:#ffffffee;backdrop-filter:blur(8px);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:3}
.back{border:0;background:var(--bg);border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
.sec{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px;margin:12px 16px}
.sec h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.verdict{border-radius:14px;padding:12px 14px;font-weight:600}.verdict.g{background:var(--em-bg);color:#065f46}.verdict.a{background:var(--am-bg);color:#92400e}.verdict.r{background:var(--rd-bg);color:#991b1b}
.plan .kv:first-of-type{border-top:0}.plan b{font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{border:0;background:var(--bg);border-radius:999px;padding:6px 12px;font:600 12px system-ui;color:var(--t2);cursor:pointer;min-height:32px}.tabs button.on{background:var(--t1);color:#fff}
.risk{display:flex;gap:6px}.risk i{flex:1;height:10px;border-radius:99px;background:var(--line)}
ul.t{margin:4px 0 0;padding-left:18px;color:var(--t2)}ul.t li{margin:4px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:1px solid var(--line);border-radius:12px;padding:10px}.tile b{font-size:18px;display:block}.tile span{font-size:12px;color:var(--mut)}
.news a{display:block;color:var(--t1);text-decoration:none;padding:10px 0;border-top:1px solid var(--line)}.news a:first-of-type{border-top:0}
.cap{font-size:11px;color:var(--mut)}
svg text{fill:var(--mut);font:11px system-ui}
#ct{position:fixed;pointer-events:none;background:#111827;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;display:none;z-index:70}
@media(max-width:820px){.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -14px 16px;padding:2px 14px;scrollbar-width:none}.hero::-webkit-scrollbar{display:none}.hc{flex:0 0 78%;scroll-snap-align:start;padding:14px}.hc .tk{font-size:22px}.wrap{padding:0 14px 50px}#q{max-width:none;order:3;flex-basis:100%;margin-left:0}.grid{grid-template-columns:1fr}.sec{margin:10px 12px}#dr{width:100%}select{width:100%}.bar{align-items:stretch}.pills{flex-basis:100%}}
</style></head><body><div class="wrap">
<header><div class="brand">Radar<span>.</span>Invest</div><span id="live">a ligar…</span><input id="q" placeholder="Procurar empresa ou ticker (ex.: MCD)" autocomplete="off"></header>
<div class="note">Ferramenta informativa, não é aconselhamento financeiro. Metas e zonas de compra são estimativas calculadas a partir de dados públicos e podem falhar. Confirma sempre antes de investir.</div>
<div class="hero" id="hero"></div>
<div class="bar"><div class="pills" id="pills"></div><select id="sort" aria-label="Ordenar"><option value="rank">Ordenar: Recomendação</option><option value="upside">Ordenar: Potencial de subida</option><option value="score">Ordenar: Qualidade</option><option value="dy">Ordenar: Dividendo</option></select></div>
<div class="grid" id="grid"></div>
</div>
<div id="ov"></div><aside id="dr" aria-hidden="true"></aside><div id="ct"></div>
<script src="data.js"></script>
<script>
const D=window.DATA,T=D.tickers,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=(v,d=0)=>v==null?"–":Number(v).toFixed(d);
const usd=v=>v==null?"–":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:v<100?2:0,maximumFractionDigits:v<100?2:0});
const eur=v=>D.eurusd&&v!=null?"€"+(v/D.eurusd).toLocaleString("en-US",{maximumFractionDigits:v/D.eurusd<100?2:0,minimumFractionDigits:v/D.eurusd<100?2:0}):"";
const sg=(v,d=0)=>v==null?"–":`<span class="${v>=0?"up":"dn"}">${v>=0?"+":""}${v.toFixed(d)}%</span>`;
const CATS=[["top","Top 10 oportunidades"],["g","Crescimento e tecnologia"],["d","Dividendos e defensivas"],["v","Valor com desconto"]];
let cat="top",sort="rank",rng="1A",q="";
const RN={"3M":64,"6M":127,"1A":9999};
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const av=k=>`<div class="av" style="background:hsl(${hue(k)} 55% 45%)">${esc(T[k].name[0])}</div>`;
const GR={"strong buy":"Compra Forte","buy":"Compra","overweight":"Sobreponderar","outperform":"Superar mercado","positive":"Positivo","hold":"Manter","neutral":"Neutro","market perform":"Manter","equal-weight":"Manter","sector perform":"Manter","underweight":"Subponderar","sell":"Vender","underperform":"Abaixo do mercado"};
const gr=g=>GR[String(g).toLowerCase()]||g;
const riskChip=r=>`<span class="chip ${r=="Baixo"?"g":r=="Médio"?"a":"r"}">${r=="Baixo"?"Risco baixo":r=="Médio"?"Risco médio":"Risco alto"}</span>`;
const zoneTag=t=>!t.buy_below?`<span class="chip b">Sem meta fiável</span>`:t.price<=t.buy_below?`<span class="chip g">Na zona de compra</span>`:`<span class="chip a">Esperar recuo</span>`;
const consBar=c=>{const t=c.total||1;return `<div class="cb"><i style="width:${100*c.strongBuy/t}%;background:#047857"></i><i style="width:${100*c.buy/t}%;background:#34d399"></i><i style="width:${100*c.hold/t}%;background:#fbbf24"></i><i style="width:${100*(c.sell+c.strongSell)/t}%;background:#ef4444"></i></div>`};

// ---------- destaques
function hero(){const h=D.highlights,B=[["Ação #1 do mês",h.pick,k=>`Meta <b>${usd(T[k].target)}</b> (${sg(T[k].upside)})`],["Melhor dividendo seguro",h.dividend,k=>`<b>${n(T[k].dy,1)}%</b> ao ano · risco ${T[k].risk.toLowerCase()}`],["Maior desconto face ao alvo",h.discount,k=>`<b>${sg(T[k].upside)}</b> até à meta ${usd(T[k].target)}`]];
$("#hero").innerHTML=B.filter(b=>b[1]).map(([l,k,f])=>`<div class="hc" data-k="${k}"><div class="hl">${l}</div><div class="tk">${k}</div><div class="sub">${esc(T[k].name)}</div><div class="big">${f(k)}</div></div>`).join("")}

// ---------- lista
function list(){let ks=D.order.slice();
if(cat=="top")ks=ks.slice(0,10);else if(cat=="v")ks=ks.filter(k=>(T[k].upside||0)>=10&&T[k].drawdown<=-8).sort((a,b)=>T[b].upside-T[a].upside);else ks=ks.filter(k=>T[k].cat==cat);
if(q){const u=q.toUpperCase();ks=D.order.filter(k=>k.includes(u)||T[k].name.toUpperCase().includes(u))}
if(sort!="rank")ks.sort((a,b)=>(T[b][sort]??-1e9)-(T[a][sort]??-1e9));return ks}
function grid(){$("#pills").innerHTML=CATS.map(([k,l])=>`<button class="pill ${k==cat&&!q?"on":""}" data-c="${k}">${l}</button>`).join("");
const ks=list();$("#grid").innerHTML=ks.map(k=>{const t=T[k],c=t.cons;return `<div class="card" data-k="${k}">
<div class="row"><div class="row" style="justify-content:flex-start;gap:10px">${av(k)}<div><div class="nm">${esc(t.name)}</div><div class="sub">${k}</div></div></div>${riskChip(t.risk)}</div>
<div class="row" style="margin:12px 0 8px"><div><span class="price" data-px="${k}">${usd(t.price)}</span> <span class="sub">${eur(t.price)}</span></div><span data-d1="${k}">${sg(t.d1,1)}</span></div>
<div class="kv"><span>Comprar abaixo de</span><b>${usd(t.buy_below)}</b></div>
<div class="kv"><span>Meta dos analistas</span><b>${usd(t.target)} <span data-up="${k}">${sg(t.upside)}</span></b></div>
<div class="kv"><span>Wall Street</span><b>${c.buy_pct==null?"–":c.buy_pct+"% compra"} <span class="sub">(${c.total})</span></b></div>${consBar(c)}
<div class="row" style="margin-top:8px"><span data-zone="${k}">${zoneTag(t)}</span><span class="sub">Qualidade ${t.score}/100</span></div></div>`}).join("")||'<p class="sub">Sem resultados.</p>'}
$("#pills").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;q="";$("#q").value="";grid()}};
$("#sort").onchange=e=>{sort=e.target.value;grid()};$("#q").oninput=e=>{q=e.target.value.trim();grid()};
$("#grid").onclick=e=>{const c=e.target.closest("[data-k]");if(c)location.hash=c.dataset.k};$("#hero").onclick=$("#grid").onclick;

// ---------- gráfico
const PW=()=>Math.min(560,($("#dr").clientWidth||innerWidth)-64);
function chart(t){const h=t.hist.slice(-RN[rng]-1),W=PW(),H=220,m={l:44,r:10,t:10,b:20};
const pmin=Math.min(...h.map(x=>x[1])),pmax=Math.max(...h.map(x=>x[1]));
const L=[[t.target,"Meta 1 "+usd(t.target),"#059669"],[t.buy_below,"Comprar abaixo "+usd(t.buy_below),"#b45309"],[t.dcf_ok?t.dcf:null,"Meta 2 "+usd(t.dcf),"#2563eb"]].filter(l=>l[0]&&l[0]>=pmin*.7&&l[0]<=pmax*1.5);
const vals=[pmin,pmax,...L.map(l=>l[0])],lo=Math.min(...vals)*.97,hi=Math.max(...vals)*1.03;
const x=i=>m.l+i/(h.length-1)*(W-m.l-m.r),y=v=>H-m.b-(v-lo)/(hi-lo)*(H-m.t-m.b),id="c"+Math.random().toString(36).slice(2,7);
let g=[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3;return `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v>=100?v.toFixed(0):v.toFixed(1)}</text>`}).join("");
g+=L.map(([v,l,c])=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W-m.r}" y="${y(v)-5}" text-anchor="end" style="fill:${c};font-weight:700">${l}</text>`).join("");
const pts=h.map((p,i)=>x(i).toFixed(1)+","+y(p[1]).toFixed(1));
g+=`<polygon points="${m.l},${H-m.b} ${pts.join(" ")} ${x(h.length-1)},${H-m.b}" fill="#2563eb14"/><polyline points="${pts.join(" ")}" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(h.length-1)}" cy="${y(t.price)}" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="${m.l}" y="${H-4}">${h[0][0].slice(0,7)}</text><text x="${W-m.r}" y="${H-4}" text-anchor="end">${h.at(-1)[0].slice(0,7)}</text><line id="${id}" y1="${m.t}" y2="${H-m.b}" stroke="#9ca3af" display="none"/>`;
setTimeout(()=>{const s=document.getElementById(id)?.closest("svg");if(!s)return;s.style.touchAction="pan-y";s.onpointermove=e=>{const b=s.getBoundingClientRect(),i=Math.max(0,Math.min(h.length-1,Math.round(((e.clientX-b.left)*W/b.width-m.l)/(W-m.l-m.r)*(h.length-1))));const l=document.getElementById(id);l.setAttribute("x1",x(i));l.setAttribute("x2",x(i));l.removeAttribute("display");const c=$("#ct");c.style.display="block";c.style.left=Math.min(e.clientX+12,innerWidth-130)+"px";c.style.top=e.clientY-40+"px";c.textContent=h[i][0]+" · "+usd(h[i][1])};
s.onpointerleave=()=>{$("#ct").style.display="none";document.getElementById(id)?.setAttribute("display","none")}});
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Preço de ${esc(t.name)} e metas">${g}</svg>`}

// ---------- gaveta
const GRADES=[["strongBuy","Compra Forte","#047857"],["buy","Compra","#34d399"],["hold","Manter","#fbbf24"],["sell","Vender","#f87171"],["strongSell","Venda forte","#ef4444"]];
function tile(v,label,desc){return `<div class="tile"><b>${v}</b><span>${label}<br>${desc}</span></div>`}
function open(k){const t=T[k],c=t.cons,s=t.tese,fromBuy=t.target&&t.buy_below?(t.target/t.buy_below-1)*100:null;
const dd=t.drawdown<=-8?`Está ${Math.abs(t.drawdown).toFixed(0)}% abaixo do máximo dos últimos 12 meses (${usd(t.high)}).`:`Está perto do máximo dos últimos 12 meses: o preço já subiu bastante, por isso a margem de erro é menor.`;
const vt=!t.buy_below?["a","Não há dados suficientes para calcular uma zona de compra fiável."]:t.price<=t.buy_below?["g",`Zona de compra: o preço atual (${usd(t.price)}) está abaixo de ${usd(t.buy_below)}, 15% abaixo do preço justo estimado.`]:["a",`Ainda acima da zona de compra. Uma entrada com margem de segurança seria abaixo de ${usd(t.buy_below)} (${n((t.buy_below/t.price-1)*100)}% face ao preço atual).`];
const ri=["Baixo","Médio","Alto"].indexOf(t.risk);
$("#dr").innerHTML=`<div class="dh"><button class="back" id="bk" aria-label="Voltar">←</button><div class="row" style="justify-content:flex-start;gap:10px">${av(k)}<div><div class="nm">${esc(t.name)}</div><div class="sub">${k} · ${esc(t.sector||"")}</div></div></div></div>
<div class="sec"><div class="row"><div><span class="price" data-px="${k}" style="font-size:30px">${usd(t.price)}</span> <span class="sub">${eur(t.price)}</span></div><span data-d1="${k}" style="font-weight:700">${sg(t.d1,1)}</span></div>
<div class="verdict ${vt[0]}" style="margin-top:12px">${vt[1]}</div></div>
<div class="sec plan"><h3>Plano de investimento</h3>
<div class="kv"><span>Comprar abaixo de</span><b>${usd(t.buy_below)}</b></div>
<div class="kv"><span>Meta 1 · Wall Street</span><b>${usd(t.target)} <span data-up="${k}">${sg(t.upside)}</span></b></div>
<div class="kv"><span>Meta 2 · Valor fundamental (DCF)</span><b>${t.dcf_ok?usd(t.dcf)+" "+sg(t.dcf_up):'<span class="sub">n/d</span>'}</b></div>
<div class="kv"><span>Intervalo dos analistas</span><b>${usd(t.tlow)} – ${usd(t.thigh)}</b></div>
${fromBuy!=null?`<div class="kv"><span>Lucro até à Meta 1 se comprares na zona de compra</span><b>${sg(fromBuy)}</b></div>`:""}
<p class="cap">Zona de compra = preço justo −15% (margem de segurança). Preço justo = média da meta dos analistas e do DCF (só se o DCF for plausível). ${t.dcf_ok?"":"O DCF não é mostrado: o modelo simples não se aplica a esta empresa (financeira, caixa livre fraco ou crescimento muito acima do que assume)."}</p></div>
<div class="sec"><div class="tabs">${Object.keys(RN).map(r=>`<button class="${r==rng?"on":""}" data-r="${r}">${r}</button>`).join("")}</div>${chart(t)}<p class="cap">Linha azul = preço · verde = Meta 1 · âmbar = zona de compra${t.dcf_ok?" · azul tracejado = Meta 2":""}</p></div>
<div class="sec"><h3>O que dizem os analistas</h3><div class="row"><b style="font-size:20px">${c.buy_pct==null?"–":c.buy_pct+"% recomendam compra"}</b><span class="chip ${c.label&&c.label.startsWith("Compra")?"g":"a"}">${c.label||"–"}</span></div>
${consBar(c)}<div class="cap">${GRADES.map(([key,l,col])=>c[key]?`<span style="color:${col}">●</span> ${l} ${c[key]}`:"").filter(Boolean).join(" · ")} · ${c.total} analistas</div>
${c.firms.length?`<div style="margin-top:8px">${c.firms.map(f=>`<div class="kv"><span>${esc(f.f)}</span><b>${esc(gr(f.g))}${f.pt?" · alvo "+usd(f.pt):""}</b></div>`).join("")}</div><p class="cap">Últimas revisões (≤120 dias).</p>`:""}</div>
<div class="sec"><h3>Nível de risco</h3><div class="risk">${[0,1,2].map(i=>`<i style="${i<=ri?`background:${["#34d399","#fbbf24","#ef4444"][ri]}`:""}"></i>`).join("")}</div>
<div class="row" style="margin-top:6px"><b>${t.risk=="Baixo"?"Baixo / defensiva":t.risk=="Médio"?"Médio":"Alto / volátil"}</b><span class="sub">oscila cerca de ±${t.vol}% por ano</span></div></div>
<div class="sec"><h3>Tese de investimento</h3>
<b>O que faz</b><p style="margin:4px 0 12px;color:var(--t2)">${esc(s.faz)}</p>
<b>Porque está barata agora</b><ul class="t"><li>${dd}</li>${s.barata.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
<b style="display:block;margin-top:12px">Catalisadores (próximos 6–18 meses)</b><ul class="t">${s.cat.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
<b style="display:block;margin-top:12px">Riscos a vigiar</b><ul class="t">${s.riscos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
<p class="cap">Contexto geral escrito à mão; confirma a causa da queda recente nas notícias abaixo.</p></div>
<div class="sec"><h3>Números em linguagem simples</h3><div class="tiles">
${tile(t.fpe?n(t.fpe,1)+"x":"–","Preço / lucro esperado","Quanto pagas por cada $1 de lucro")}

function paint(s,p){const t=T[s];if(!t)return;t.price=p;if(t.prev)t.d1=(p/t.prev-1)*100;if(t.target)t.upside=(t.target/p-1)*100;
document.querySelectorAll(`[data-px="${s}"]`).forEach(e=>{e.textContent=usd(p);e.style.color="#2563eb";setTimeout(()=>e.style.color="",300)});

document.querySelectorAll(`[data-zone="${s}"]`).forEach(e=>e.innerHTML=zoneTag(t))}
function dec(b64){const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let i=0,id,px;const vi=()=>{let r=0,s=0,x;do{x=b[i++];r|=(x&127)<<s;s+=7}while(x&128&&i<b.length);return r};
while(i<b.length){const tag=vi(),fl=tag>>3,w=tag&7;if(w==0)vi();else if(w==1)i+=8;else if(w==5){if(fl==2)px=new DataView(b.buffer,i,4).getFloat32(0,true);i+=4}else if(w==2){const l=vi();if(fl==1)id=new TextDecoder().decode(b.slice(i,i+l));i+=l}else break}return[id,px]}
function connect(){ws=new WebSocket("wss://streamer.finance.yahoo.com/?version=2");
ws.onopen=()=>{retry=0;live("ligado · à espera de negócios");ws.send(JSON.stringify({subscribe:Object.keys(T)}))};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type!="pricing")return;const[id,px]=dec(m.message);if(id&&px>0){paint(id,px);last=Date.now();live("● ao vivo · "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit",second:"2-digit"}))}}catch(_){}};
ws.onclose=()=>{live("a reconectar…");setTimeout(connect,Math.min(30000,1000*2**retry++))};ws.onerror=()=>ws.close()}
setInterval(()=>{if(last&&Date.now()-last>90000)live("sem negócios há mais de 90 s (mercado fechado?)")},15000);
