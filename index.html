<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Investimento</title>
<style>
:root{--bg:#070b16;--bg2:#0b1224;--card:#0f172b;--card2:#131c33;--line:#1e2a46;--t1:#eef2ff;--t2:#aab4d4;--mut:#7885a8;--acc:#7c8cff;--acc2:#22d3ee;--up:#34d399;--dn:#fb7185;--am:#fbbf24;

[data-theme=light]{--bg:#f3f5fb;--bg2:#fff;--card:#fff;--card2:#f6f8fd;--line:#e3e8f3;--t1:#0f172a;--t2:#475569;--mut:#64748b;--acc:#4f5bd5;--acc2:#0e7490;--up:#059669;--dn:#e11d48;--am:#b45309;

*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}

.qg{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}@media(min-width:760px){.qg{grid-template-columns:1fr 1fr}}.qs{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}.qs i{font-style:normal;font-size:18px;line-height:1.3}.qs>div{min-width:0}.qs b{display:block;font-size:13.5px;line-height:1.35}.qs .sub{display:block;font-size:12px;margin-top:3px;line-height:1.45}.qs.g{border-color:rgba(52,211,153,.45)}.qs.r{border-color:rgba(251,113,133,.45)}.qs.a{border-color:rgba(251,191,36,.45)}.gcs{display:inline-flex;gap:3px;flex-wrap:wrap;margin-right:4px}.gc{display:inline-block;min-width:26px;text-align:center;font:700 10px system-ui;padding:2px 4px;border-radius:6px}.gc.y{background:var(--upbg);color:var(--up)}.gc.x{background:var(--dnbg);color:var(--dn)}.gc.n{background:var(--card);color:var(--mut)}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px 70px}
button{font-family:inherit}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 8px}

.cta{border:0;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font:700 14px system-ui;padding:12px 20px;cursor:pointer;min-height:44px}

.mc{border-radius:20px;padding:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s;box-shadow:var(--sh)}.mc:hover{transform:translateY(-2px);border-color:var(--acc)}
.mc .hl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.mc .tk{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}.mc .big{margin-top:6px;color:var(--t2);font-size:14px}.mc .big b{color:var(--up);font-size:18px}
.ctl{position:sticky;top:0;z-index:25;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;margin-bottom:8px;background:linear-gradient(var(--bg),var(--bg) 70%,transparent)}
.regs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}.regs button{border:0;background:none;border-radius:999px;padding:9px 15px;font:600 14px system-ui;color:var(--t2);cursor:pointer;min-height:40px}.regs button.on{background:var(--accbg);color:var(--acc)}
.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.views::-webkit-scrollbar{display:none}.views button{border:0;background:none;font:700 14px system-ui;color:var(--mut);padding:10px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:44px}.views button.on{background:var(--t1);color:var(--bg)}
.note{font-size:12px;color:var(--mut);margin-top:30px;text-align:center;line-height:1.6}
.sub{font-size:12px;color:var(--mut)}.cap{font-size:11px;color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}.num{font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;align-items:center;margin:6px 0 6px;flex-wrap:wrap}

.pill{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font:600 14px system-ui;color:var(--t2);cursor:pointer;min-height:44px}.pill.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

.dh{position:sticky;top:0;background:var(--glass);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:3}
.back{border:0;background:var(--card);color:var(--t1);border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 16px}

.verdict{border-radius:14px;padding:12px 14px;font-weight:600}.verdict.g{background:var(--upbg);color:var(--up)}.verdict.a{background:var(--ambg);color:var(--am)}.verdict.r{background:var(--dnbg);color:var(--dn)}
.plan .kv:first-of-type{border-top:0}.plan b{font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{border:0;background:var(--card2);border-radius:999px;padding:6px 12px;font:600 12px system-ui;color:var(--t2);cursor:pointer;min-height:32px}.tabs button.on{background:var(--t1);color:var(--bg)}
.risk{display:flex;gap:6px}.risk i{flex:1;height:10px;border-radius:99px;background:var(--line)}
ul.t{margin:4px 0 0;padding-left:18px;color:var(--t2)}ul.t li{margin:4px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:10px}.tile b{font-size:18px;display:block}.tile span{font-size:12px;color:var(--mut)}
.news a{display:block;color:var(--t1);text-decoration:none;padding:10px 0;border-top:1px solid var(--line)}.news a:first-of-type{border-top:0}.news a:hover{color:var(--acc)}
svg text{fill:var(--mut);font:11px system-ui}

.xt td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px;white-space:nowrap}.xt tbody tr{cursor:pointer}.xt tbody tr:hover{background:var(--card2)}

.mv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}.mv:first-of-type{border-top:0}

@media(max-width:820px){.wrap{padding:0 14px 50px}.top{flex-wrap:wrap}#q{order:5;max-width:none;flex-basis:100%;margin-left:0}.livepill{margin-left:auto;font-size:11px;padding:6px 10px}.brand{font-size:18px}.top{gap:8px}.ibtn{width:40px;height:40px}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.fstats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:minmax(0,1fr)}.sec{margin:10px 12px}#dr{width:100%}select{width:100%}.bar{align-items:stretch}.pills{flex-basis:100%}.hm{display:none}.xt td,.xt th{padding:11px 6px}.regs button{padding:9px 11px}.sb{grid-template-columns:96px 1fr 48px}}

.qh{display:flex;align-items:center;gap:14px;margin-bottom:10px}.qn{font-size:34px;font-weight:800;line-height:1}.qn small{font-size:14px;color:var(--mut);font-weight:600}

.dots{display:flex;gap:4px;margin:6px 0}.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}.dots i.y{background:var(--up)}.dots i.x{background:var(--dn)}

.yt{overflow-x:auto;margin-top:8px}.yt table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}.yt th,.yt td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}.yt th:first-child,.yt td:first-child{text-align:left;color:var(--mut);position:sticky;left:0;background:var(--card)}.yt th{color:var(--mut);font-weight:600}

.livepill{cursor:pointer}.livepill.ok{color:var(--up);border-color:rgba(52,211,153,.4)}.livepill.warn{color:var(--am);border-color:rgba(251,191,36,.4)}.livepill.bad{color:var(--dn);border-color:rgba(251,113,133,.4)}
.sn{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}.sn.pos{background:var(--upbg);color:var(--up)}.sn.neg{background:var(--dnbg);color:var(--dn)}.sn.neu{background:var(--ambg);color:var(--am)}
.news a .sn{margin-left:6px}.chk{list-style:none;margin:6px 0;padding:0}.chk li{font-size:13px;padding:4px 0 4px 22px;position:relative;color:var(--t2)}.chk li:before{content:"✓";position:absolute;left:0;color:var(--up);font-weight:800}.chk li.no:before{content:"✕";color:var(--dn)}

.livepill .sh{display:none}@media(max-width:520px){.vbar{font-size:10px}.livepill .lg{display:none}.livepill .sh{display:inline}}

function methodHTML(){const m=D.meta;return `<div class="m"><h3>Como funciona</h3>
<h4>1. Universo</h4><p>${m.n_universe.toLocaleString("pt-PT")} ações de ${m.n_exch} bolsas, com capitalização ≥ ${m.min_usd/1e9} mil milhões USD (convertida ao câmbio atual). Só bolsas normalmente acessíveis em corretoras europeias comuns (XTB, Trading 212, DEGIRO): EUA e Europa Ocidental e Nórdica. Empresas globais cotadas em Nova Iorque (ADRs) estão incluídas. A disponibilidade de cada ação individual depende da corretora: confirma na tua antes de comprar.</p>
<h4>2. Fatores (percentis dentro do setor)</h4><p>Cada ação é comparada apenas com empresas do mesmo setor, porque um P/E de 15 é barato em tecnologia e caro em utilities. Cinco fatores: <b>Valor</b> (P/E projetado, P/B, rendimento dos lucros), <b>Crescimento</b> (lucro por ação esperado vs. último ano), <b>Momentum</b> (retorno 12m e preço vs. média de 200 dias), <b>Analistas</b> (nota média) e <b>Rendimento</b> (dividendo, limitado a 12%). Usamos percentis (0–100) em vez de valores brutos para neutralizar valores extremos.</p>
<h4>3. Score estatístico</h4><p>Média ponderada dos percentis disponíveis (Valor 30%, Analistas 25%, Crescimento 20%, Momentum 15%, Rendimento 10%). Exige pelo menos 3 fatores com dados.</p>
<h4>4. Análise completa</h4><p>As ${m.n_deep} melhores por score com capitalização ≥ ${m.deep_min_usd/1e9} mil milhões USD, mais as ações curadas, recebem dados detalhados: rácios, DCF, metas e consenso de analistas, notícias e risco.</p>
<h4>5. Metas, probabilidades e zona de compra</h4><p><b>Meta 1 (tática, 3, 6 ou 12 meses; por defeito 6)</b> = nível que o preço tem cerca de 65% de probabilidade de tocar nesse prazo (calibrado pela volatilidade anual da ação) ou, se estiver mais perto, o reteste do máximo de 52 semanas. <b>Meta 2 (preço justo, 12 meses)</b> = o preço justo abaixo, com a sua probabilidade. A probabilidade é a de o preço <i>tocar</i> o nível (movimento sem tendência, princípio da reflexão); num backtest de 10 anos (265 ações, com viés de sobrevivência) os níveis dados a 65% foram tocados em 68% (3m), 70% (6m) e 72% (12m), e acima do máximo de 52 semanas acertam 3 a 6 pontos menos. Quando uma meta exige novo máximo, a ficha avisa. O alvo médio dos analistas é só informação (em estudos académicos só cerca de um quarto dos alvos se cumpre aos 12 meses). Preço justo = média do alvo dos analistas e do DCF simples (fluxo de caixa livre a 10 anos, crescimento limitado a 8%, desconto 9%, só quando a moeda das demonstrações é a do preço; o DCF só entra se estiver entre 0,5× e 2× o preço). Zona de compra = preço justo − 15%.</p>
<h4>6. Análise das contas</h4><p>Para cada análise completa lemos as demonstrações financeiras anuais (equivalentes aos 10-K) e calculamos indicadores financeiros: <b>Piotroski F</b> (9 testes de saúde financeira), <b>Altman Z</b> (risco de falência), <b>Beneish M</b> (sinais de manipulação de lucros), <b>ROIC vs custo de capital</b> (a empresa cria valor?), <b>P/E atual vs a sua própria história</b> e margens vs média própria (evita comprar no pico do ciclo), <b>DCF inverso</b> (que crescimento o preço atual já assume), e <b>revisões, dispersão e surpresas dos analistas</b>. A combinação dá uma nota de qualidade 0–100 e assinala possíveis <b>armadilhas de valor</b> (barata face à história, mas com margens em pico, contas fracas ou estimativas a cair). Bancos e seguradoras ficam de fora destas métricas. São heurísticas, não garantias.</p>
<h4>6b. Auditoria forense e modelos quantitativos</h4><p><b>Sloan</b>: (lucro líquido − caixa operacional) / ativos médios; acima de 10% é alerta (≤5% é lucro em caixa). <b>Mohanram G-Score</b> (0-8, ações de crescimento): ROA e caixa/ativos acima da mediana do setor, caixa operacional superior ao lucro, estabilidade do ROA e das vendas, e intensidade de I&amp;D, capex e publicidade (aqui SG&amp;A) acima da mediana; com poucos anos de histórico o Yahoo dá só 3 a 4 exercícios. <b>Magic Formula</b> (Greenblatt): soma dos ranks de EBIT/EV e de EBIT/(fundo de maneio + ativos fixos), sem financeiras nem utilities, só entre as análises completas (não o mercado inteiro); Top Pick = decil superior. <b>Divergência de RSI</b> (14, Wilder) e <b>banda de Bollinger de 2,5σ</b> são sinais informativos: o nosso backtest não mostrou vantagem além de «a ação caiu muito». Nada disto entra no ranking.</p><h4>7. Risco e cenários</h4><p>Volatilidade, queda máxima, VaR 95%, beta face ao S&amp;P 500 e Sharpe calculados com 12 meses de preços. Os cenários usam um modelo lognormal com retorno esperado CAPM (${m.rf*100}% + beta × ${m.erp*100}%). ${D.macro&&D.macro.DGS10?"Taxa sem risco: FRED, observação de "+esc(D.macro.DGS10.d):"Taxa sem risco de reserva: FRED indisponível na geração dos dados."}</p>
<h4>8. Classificação das oportunidades</h4><p>22% fundamentos (sem preço-alvo), 15% fatores setoriais sem o fator analistas, 23% potencial até ao alvo, 20% consenso ajustado e 20% qualidade, menos penalizações de risco e ciclicidade. A seleção inicial mantém os cinco fatores. As componentes ainda partilham informação financeira; os pesos são heurísticos, sem validação de rentabilidade histórica. Elite exige FCF yield positivo e dívida líquida/EBITDA conhecida abaixo de 4; dados em falta não aprovam estes critérios.</p><h4>Controlo de qualidade</h4><p>${qcText()}</p><h4>Limitações</h4><p>Os dados vêm do Yahoo Finance (gratuito, pode ter erros ou atrasos). Percentis só comparam com o universo acima, não com o mercado inteiro. Rácios de bancos e empresas com demonstrações noutra moeda podem ser menos fiáveis. Isto é informação, não aconselhamento financeiro. Análise completa: ${esc(D.analysis_updated||D.updated)}. Ranking recalculado na renovação do servidor; cotações WebSocket não reordenam a lista. A cache de 10 minutos só é consultada ao abrir ou recarregar a sessão.</p></div>`}
$("#meth").innerHTML=methodHTML();

function dec(b64){const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let i=0,id,px;const vi=()=>{let r=0,s=0,x;do{x=b[i++];r|=(x&127)<<s;s+=7}while(x&128&&i<b.length);return r};
let ts=null;while(i<b.length){const tag=vi(),fl=tag>>3,w=tag&7;if(w==0){if(fl==3){let r=0n,sh=0n,x;do{x=b[i++];r|=BigInt(x&127)<<sh;sh+=7n}while(x&128&&i<b.length);ts=Number((r>>1n)^-(r&1n))}else vi()}else if(w==1)i+=8;else if(w==5){if(fl==2)px=new DataView(b.buffer,i,4).getFloat32(0,true);i+=4}else if(w==2){const l=vi();if(fl==1)id=new TextDecoder().decode(b.slice(i,i+l));i+=l}else break}return[id,px,ts]}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// DCF a 10 anos com crescimento a decair linearmente até ao crescimento terminal (igual ao do fetch.py)
function dcfPS(fcf,g,sh,nd,r,tg){let c=fcf,pv=0;for(let y=1;y<=10;y++){c*=1+g+(tg-g)*(y-1)/9;pv+=c/Math.pow(1+r,y)}pv+=c*(1+tg)/(r-tg)/Math.pow(1+r,10);return(pv-nd)/sh}
// preço justo com as hipóteses (g = crescimento anual, r = taxa de desconto, m = P/E alvo no modo "pe")
function fairAt(S,g,r,m){if(!S)return null;let v=null;if(S.mode=="dcf"&&fin(S.fcf)&&S.sh>0)v=dcfPS(S.fcf,g,S.sh,S.nd||0,r,S.tg);else if(S.mode=="pe"&&fin(S.eps)&&fin(m))v=S.eps*Math.pow(1+g,3)*m/Math.pow(1+r,3);return fin(v)&&v>0?v:null}
// pontos de partida do simulador (blindados: nunca NaN, crescimento e múltiplos limitados)
function simBase(t){const S=t.sim;if(!S||!S.mode)return null;const hp=t.q&&t.q.hist_pe;let g=S.g;
if(S.mode=="pe"){const gf=S.epsf&&S.eps?S.epsf/S.eps-1:null;g=fin(gf)?clamp(gf,-.1,.3):clamp(S.g,0,.12)}else g=clamp(S.g,-.05,.2);
let pe=S.fpe||t.fpe||t.pe;pe=fin(pe)?clamp(hp&&hp.mean?Math.min(pe*1.1,Math.max(hp.mean,pe*.7)):pe,6,45):18;
return{S,g,r:S.r||.09,tg:S.tg||.03,pe}}
function scen(t){const b=simBase(t);if(!b)return null;const mk=(nm,dg,dr,pm,col)=>{const g=clamp(b.g+dg,-.08,.3),r=b.r+dr,pe=clamp(b.pe*pm,5,55),px=fairAt({...b.S,tg:b.tg+(dr<0?.005:dr>0?-.005:0)},g,r,pe);return{nm,g,r,pe,px,col}};
return{b,bear:mk("Pessimista",-.06,.01,.75,"var(--dn)"),base:mk("Realista",0,0,1,"var(--acc)"),bull:mk("Otimista",.06,-.005,1.2,"var(--up)")}}
function probs(t,K){const s=t.rs||{};if(!s.vol||!K)return null;const v=s.vol/100,m=(s.mu/100)-v*v/2;return 1-Phi((Math.log(K/t.price)-m)/v)} // P(preço em 12m ≥ K)
function simHTML(t,k){const sc=scen(t);if(!sc||!sc.bear.px||!sc.base.px||!sc.bull.px)return`<div class="sec"><h3>Simulador de cenários</h3><p class="cap">Sem dados suficientes (caixa livre ou lucros negativos/indisponíveis, ou empresa financeira) para um modelo fiável de 3 cenários. Usa os alvos dos analistas (intervalo ${usd(t.tlow,t.cur)} – ${usd(t.thigh,t.cur)}).</p></div>`;
const {bear,base,bull,b}=sc,p=t.price,pc=x=>(x/p-1)*100,lo=Math.min(bear.px,p)*.95,hi=Math.max(bull.px,p)*1.05,pos=v=>clamp((v-lo)/(hi-lo)*100,0,100);
const dn=Math.max(0.01,(p-bear.px)/p),upv=(bull.px-p)/p,ratio=dn>0&&bear.px<p?upv/dn:null;

const mid=pos(p),sl=`<div class="sl"><label>Crescimento anual <b id="sg_v"></b></label><input type="range" id="sg" min="-5" max="25" step="0.5" value="${(b.g*100).toFixed(1)}"></div><div class="sl"><label>Taxa de desconto <b id="sr_v"></b></label><input type="range" id="sr" min="6" max="13" step="0.25" value="${(b.r*100).toFixed(2)}"></div>${b.S.mode=="pe"?`<div class="sl"><label>P/E alvo <b id="sm_v"></b></label><input type="range" id="sm" min="5" max="55" step="1" value="${b.pe.toFixed(0)}"></div>`:""}`;

const cell=(g,c)=>{const v=fairAt(b.S,g,b.S.mode=="dcf"?c:b.r,b.S.mode=="dcf"?0:c);if(!v)return"<td>–</td>";const d=pc(v);return`<td class="${d>=15?"gg":d>=0?"g2":d>-15?"r2":"rr"}"><b>${usd(v,t.cur)}</b><br><span>${d>=0?"+":""}${d.toFixed(0)}%</span></td>`};
return`<div class="sec" id="simsec"><h3>Simulador de cenários · Pessimista / Realista / Otimista</h3>

<div class="kv"><span>Retorno / risco (Otimista vs Pessimista)</span><b>${ratio!=null&&bull.px>p?`+${(upv*100).toFixed(0)}% para −${(dn*100).toFixed(0)}% → ${ratio.toFixed(1)}×`:`preço atual fora do intervalo dos cenários`}</b></div>
${pb!=null?`<div class="kv"><span>Prob. em 12 meses de cair abaixo do Pessimista</span><b>${((1-pb)*100).toFixed(0)}%</b></div><div class="kv"><span>…de ficar acima do Realista</span><b>${(pbs*100).toFixed(0)}%</b></div><div class="kv"><span>…de superar o Otimista</span><b>${(pbu*100).toFixed(0)}%</b></div>`:""}
${base.px<p*.6?`<div class="verdict a" style="margin:8px 0">Mesmo no cenário Otimista o modelo simples fica ${bull.px<p?"abaixo":"perto"} do preço: o mercado está a assumir crescimento ou margens bem acima do que este modelo projeta (vê o “DCF inverso” na auditoria às contas). Usa o simulador para ver que crescimento justificaria o preço.</div>`:""}<p class="cap">Probabilidades do modelo estatístico (volatilidade histórica de 12 meses, retorno esperado CAPM), não dos cenários em si.</p>
<h3 style="margin-top:16px">Experimenta as tuas hipóteses</h3>${sl}<div class="simout" id="so"></div>
<h3 style="margin-top:16px">Sensibilidade do preço justo</h3><div class="yt"><table class="sens"><tr><th>${b.S.mode=="dcf"?"Crescimento ↓ / desconto →":"Crescimento ↓ / P/E alvo →"}</th>${C.map(c=>`<th>${b.S.mode=="dcf"?(c*100).toFixed(0)+"%":c.toFixed(0)+"×"}</th>`).join("")}</tr>${G.map(g=>`<tr><td>${(g*100).toFixed(0)}%/ano</td>${C.map(c=>cell(g,c)).join("")}</tr>`).join("")}</table></div>
<p class="cap">${b.S.mode=="dcf"?"Modelo DCF a 10 anos (crescimento do caixa livre a decair até "+(b.tg*100).toFixed(0)+"%).":"Modelo de lucros: LPA atual × (1+crescimento)³ × P/E alvo, descontado 3 anos."} Pessimista = crescimento −6 p.p., desconto/múltiplo menos favoráveis; Otimista = +6 p.p. Verde: ≥15% acima do preço atual; vermelho: abaixo. Ilustração de sensibilidade, não previsão.</p></div>`}

const PEERM=[["P/E projetado","fpe",t=>t.fpe??t.pe,-1,v=>v!=null&&v>0&&v<300,v=>n(v,1)],["Margem operacional","om",t=>t.om,1,fin,v=>n(v,1)+"%"],["Crescimento das vendas","rg",t=>t.rg,1,fin,v=>n(v,1)+"%"],["Dívida líquida / EBITDA","nd",t=>t.nd,-1,fin,v=>n(v,1)+"×"],["Score de qualidade","qs",t=>t.q&&t.q.qscore,1,fin,v=>n(v,0)],["Potencial até à Meta 1","up",t=>t.upside,1,fin,v=>(v>=0?"+":"")+n(v,0)+"%"]];
function peerList(k){const t=T[k];let a=Object.keys(T).filter(x=>x!=k&&T[x].industry&&T[x].industry==t.industry);if(a.length<2)a=Object.keys(T).filter(x=>x!=k&&T[x].sector==t.sector);

${PEERM.map(([l,,f,,ok,fm],mi)=>`<tr><td>${l}</td>${all.map((x,i)=>{const v=f(T[x]);return`<td class="${i?"":"me"}">${ok(v)?fm(v):"–"}${best[mi]==i?' <i class="win" title="Melhor do grupo">✓</i>':""}</td>`}).join("")}<td>${med[mi]!=null?fm0(PEERM[mi],med[mi]):"–"}</td></tr>`).join("")}</table></div>

// ================= Plano de Ação: carteira pronta a executar (capital + perfil → ordens) =================
// Níveis por ação: entrada, Meta 1 (tática, ~65% de probabilidade no prazo escolhido), Meta 2 (preço justo, 12 meses) e stop largo (6×ATR ou abaixo do suporte principal: só protege de quebras estruturais; stops curtos foram acionados por ruído em 53-59% das operações no backtest)
function planLevels(t){const p=t.price;if(!fin(p)||p<=0)return null;
const atr=fin(t.atr)&&t.atr>0?t.atr:p*((t.vol||30)/100)/Math.sqrt(252)*.9;
const sup=(t.sr&&t.sr.sup)||[];
const inZone=!!(t.buy_below&&p<=t.buy_below),s0=sup.find(x=>x.p<p&&x.p>=p-3.5*atr);
const entry1=p*1.01;let entry2=null;
if(!inZone){const c=Math.max(t.buy_below||0,s0?s0.p*1.01:0);if(c>=p*.8&&c<p*.995)entry2=c}
const X=exitTargets(t,p);if(!X)return null;const t1=X.m1.v,t2=X.m2.v;
const main=sup.filter(x=>x.p<p&&x.p>=p-10*atr).sort((a,b)=>b.n-a.n||b.p-a.p)[0];
const c1=p-6*atr,c2=main?main.p*.985:null;let stop=c2?Math.min(c1,c2):c1;stop=clamp(stop,p*.7,p*.9);
if(entry2&&entry2<=stop)entry2=null;
if(!inZone&&!entry2)return null;
const ref=entry2?2/(1/entry1+1/entry2):entry1; // duas parcelas iguais em dinheiro, se ambas executadas
return{p,atr,inZone,entry1,entry2,t1,t2,X,stop,s0,ref,loss:(ref-stop)/ref,gain1:t1/ref-1,gain2:t2/ref-1,rr:(t1-ref)/Math.max(ref-stop,1e-9),byStop:c2&&c2<c1?"suporte":"6×ATR"}}
const WHT=k=>k.endsWith(".L")?0:k.includes(".")?.25:.15; // retenção na fonte típica (aprox.): EUA 15% com W-8BEN, Reino Unido 0%, resto da Europa ~25%
const PROF={bal:["⚖️ Equilibrado","Até 5 empresas de elite: valorização, qualidade e dividendos",5],div:["🛡️ Dividendos & Renda","Até 5 gigantes defensivas focadas no dividendo",5],gro:["🚀 Alto Crescimento & IA","Até 5 líderes com maior potencial de subida",5]};
function planPool(prof){const base=Object.keys(T).filter(k=>{const t=T[k];return t.price>0&&D.eurusd&&fxOf(k)&&t.cons.total>=5&&!(t.q&&t.q.trap)&&planLevels(t)&&(t.q&&t.q.qscore!=null)});
const sc=k=>{const t=T[k],q=t.q.qscore,pl=planLevels(t),up=clamp(pl.gain2*100,0,60),bp=t.cons.buy_pct||0,cy=(t.q.norm&&(t.q.norm.peak?25:t.q.norm.cyc?12:0))||0,rrb=clamp(pl.rr,0,2)*4;
if(prof=="bal")return t.elite?100+t.rank:null;

const out=[],cnt={},maxS=prof=="gro"?3:2;for(const[k]of c){const s=T[k].sector||"x";if((cnt[s]||0)>=maxS)continue;cnt[s]=(cnt[s]||0)+1;out.push(k);if(out.length>=5)break}return out}
// pesos: inverso da volatilidade (risk parity simples) × inclinação de qualidade; teto 35%, piso 8%
function planWeights(ks){let w=ks.map(k=>{const t=T[k];return(1/Math.max(12,t.vol||30))*clamp((t.q.qscore||60)/70,.7,1.3)});

const PL={cap:clamp(+(localStorage.plCap||2000),200,1e6),prof:localStorage.plProf||"bal"};
const E0=v=>"€"+v.toLocaleString("pt-PT",{maximumFractionDigits:0}),E2=v=>"€"+v.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2}),EP=(v,k)=>{const e=eur(v,k);return e||usd(v,T[k].cur)};
function planCalc(){const ks=planPool(PL.prof);if(!ks.length)return{ks:[]};const w=planWeights(ks);const rows=ks.map((k,i)=>{const t=T[k],pl=planLevels(t),amt=Math.round(PL.cap*w[i]),ep=eurPx(k)*pl.ref/t.price,sh=amt/ep;return{k,t,pl,w:w[i],amt,sh,whole:Math.floor(sh),div:amt*(t.dy||0)/100*(1-WHT(k)),divg:amt*(t.dy||0)/100}});
const diff=PL.cap-rows.reduce((a,r)=>a+r.amt,0);rows[0].amt+=diff;rows[0].sh=rows[0].amt/(eurPx(rows[0].k)*rows[0].pl.ref/rows[0].t.price);rows[0].whole=Math.floor(rows[0].sh);

const vol=volOfW(ks,w),wv=rows.reduce((a,r)=>a+r.w*(r.t.vol||30)/100,0),effN=1/w.reduce((a,x)=>a+x*x,0),secs=new Set(rows.map(r=>r.t.sector)).size;

async function posFH(q){const u=q.toUpperCase(),k=localStorage.fhKey;if(!k||FH[u])return;FH[u]="x";try{const g=p=>fetch("https://finnhub.io/api/v1/"+p+(p.includes("?")?"&":"?")+"token="+encodeURIComponent(k)).then(r=>r.json());
