</style></head><body><div class="wrap">
<header class="top"><div class="brand"><span class="logo">◆</span>Radar<span>.</span>Invest</div><input id="q" placeholder="Procurar entre milhares de ações (ex.: Nestlé, SAP)" autocomplete="off"><span id="live" class="livepill">a ligar…</span><button class="ibtn" id="theme" aria-label="Alternar tema claro/escuro">◐</button></header>
<section class="hero2" id="hero2"><div class="hcopy"><h1>Onde investir <em>hoje</em>?</h1><p id="hsub"></p><div class="idxs" id="idxs"></div></div><div class="feat" id="feat"></div><div class="mini" id="mini"></div></section>
<div class="ctl"><div class="regs" id="regs"><button data-r="all" class="on">🌍 Todas</button><button data-r="us">🇺🇸 EUA</button><button data-r="eu">🇪🇺 Europa</button></div>

<div id="v1"><div class="bar"><div class="pills" id="pills"></div><select id="sort" aria-label="Ordenar"><option value="rank">Ordenar: Melhor oportunidade</option><option value="upside">Ordenar: Potencial de subida</option><option value="score">Ordenar: Qualidade</option><option value="dy">Ordenar: Dividendo</option></select></div>

<script src="data.js"></script>
<script>
if(!window.DATA||!window.DATA.rows||!window.DATA.order){document.body.innerHTML='<div style="padding:40px;font:16px system-ui">Dados antigos ou em falta: a base está a ser atualizada. Recarrega a página dentro de alguns minutos.</div>';throw new Error("dados antigos")}
const D=window.DATA,T=D.tickers,$=s=>document.querySelector(s);
const R=D.rows.map(a=>{const o={};D.cols.forEach((c,i)=>o[c]=a[i]);return o}),ROW=Object.fromEntries(R.map(r=>[r.s,r])),PAIS=D.pais,EXI=D.exinfo||{};
let REG='all';
const regOf=k=>ROW[k]?(EXI[ROW[k].ex]||{}).r:(k.includes('.')?'eu':'us');
const exName=k=>ROW[k]?((EXI[ROW[k].ex]||{}).n||ROW[k].ex):(k.includes('.')?'Europa':'EUA');
const qchip=k=>{const q=(T[k]||{}).q;return q&&q.qscore!=null?`<span class="chip ${q.trap?'a':q.qscore>=70?'g':q.qscore>=50?'b':'r'} tiny" title="Qualidade do negócio (0-100): ${esc(q.qlabel)}">${q.trap?'⚠ ':''}${esc(q.qlabel)} · ${q.qscore}</span>`:''};
const brk=k=>`<span class="chip b tiny" style="margin-left:0" title="Bolsa normalmente acessível em XTB, Trading 212 e DEGIRO. A disponibilidade de cada ação depende da corretora: confirma antes de comprar.">${exName(k)} · ${(T[k]||ROW[k]).cur} · XTB / T212</span>${qchip(k)}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function hl(){const el=D.order.filter(k=>(REG=='all'||regOf(k)==REG)&&T[k].cons.total>=5),pick=el[0],dv=el.filter(k=>(T[k].dy||0)>=2&&T[k].risk!='Alto'&&(T[k].payout||0)<90&&(T[k].fcfy||0)>0).sort((a,b)=>T[b].dy-T[a].dy)[0],ds=el.filter(k=>k!=pick&&T[k].score>=55&&(T[k].cons.buy_pct||0)>=50&&T[k].upside).sort((a,b)=>T[b].upside-T[a].upside)[0];return{pick,dividend:dv,discount:ds}}
const TP=D.tape||{};
let SPN=0;
function spark(k,o={}){const t=T[k];if(!t||!t.hist)return"";const w=o.w||260,h=o.h||52,n=o.n||90,pad=o.pad??3,h_=t.hist.slice(-n).map(x=>x[1]);if(h_.length<3)return"";
const up=h_[h_.length-1]>=h_[0],c=up?"var(--up)":"var(--dn)",L=[];

const mn0=Math.min(...h_),mx0=Math.max(...h_),F=L.filter(l=>l[0]>=mn0*.75&&l[0]<=mx0*1.35),all=[mn0,mx0,...F.map(l=>l[0])],mn=Math.min(...all),mx=Math.max(...all),id="g"+(SPN++);
const X=i=>pad+i/(h_.length-1)*(w-2*pad-(o.lines?92:0)),Y=v=>h-pad-(v-mn)/((mx-mn)||1)*(h-2*pad);
const pts=h_.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}" role="img" aria-label="Preço no último ano"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".30"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
${F.map(([v,l,col])=>`<line x1="${pad}" x2="${w-pad-88}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-dasharray="4 4" stroke-width="1.3"/><text x="${w-pad}" y="${Y(v)+4}" text-anchor="end" style="fill:${col};font-weight:700">${l}</text>`).join("")}
<polygon points="${X(0)},${h} ${pts} ${X(h_.length-1)},${h}" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${o.sw||1.8}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${X(h_.length-1)}" cy="${Y(h_[h_.length-1])}" r="3.2" fill="${c}"/></svg>`}
function ring(v,sz=46){const r=sz/2-4,C=2*Math.PI*r,col=v>=75?"var(--up)":v>=55?"var(--acc)":"var(--am)";return `<div class="ring" style="width:${sz}px;height:${sz}px" title="Oportunidade ${v}/100"><svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(v/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${v}</b></div>`}
const chgPill=v=>v==null?"":`<span class="chg" style="background:var(--${v>=0?"upbg":"dnbg"});color:var(--${v>=0?"up":"dn"})">${v>=0?"▲ +":"▼ "}${Math.abs(v).toFixed(1)}%</span>`;

const PW=()=>Math.min(560,($("#dr").clientWidth||innerWidth)-64);
function chart(t){const h=t.hist.slice(-RN[rng]-1),W=PW(),H=220,m={l:44,r:10,t:10,b:20};
const pmin=Math.min(...h.map(x=>x[1])),pmax=Math.max(...h.map(x=>x[1]));

g+=L.map(([v,l,c])=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W-m.r}" y="${y(v)-5}" text-anchor="end" style="fill:${c};font-weight:700">${l}</text>`).join("");
const pts=h.map((p,i)=>x(i).toFixed(1)+","+y(p[1]).toFixed(1));
g+=`<polygon points="${m.l},${H-m.b} ${pts.join(" ")} ${x(h.length-1)},${H-m.b}" fill="var(--accbg)"/><polyline points="${pts.join(" ")}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(h.length-1)}" cy="${y(t.price)}" r="4.5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>
<text x="${m.l}" y="${H-4}">${h[0][0].slice(0,7)}</text><text x="${W-m.r}" y="${H-4}" text-anchor="end">${h.at(-1)[0].slice(0,7)}</text><line id="${id}" y1="${m.t}" y2="${H-m.b}" stroke="var(--mut)" display="none"/>`;
setTimeout(()=>{const s=document.getElementById(id)?.closest("svg");if(!s)return;s.style.touchAction="pan-y";s.onpointermove=e=>{const b=s.getBoundingClientRect(),i=Math.max(0,Math.min(h.length-1,Math.round(((e.clientX-b.left)*W/b.width-m.l)/(W-m.l-m.r)*(h.length-1))));const l=document.getElementById(id);l.setAttribute("x1",x(i));l.setAttribute("x2",x(i));l.removeAttribute("display");const c=$("#ct");c.style.display="block";c.style.left=Math.min(e.clientX+12,innerWidth-130)+"px";c.style.top=e.clientY-40+"px";c.textContent=h[i][0]+" · "+usd(h[i][1],t.cur)};
s.onpointerleave=()=>{$("#ct").style.display="none";document.getElementById(id)?.setAttribute("display","none")}});

<h4>3. Score estatístico</h4><p>Média ponderada dos percentis disponíveis (Valor 30%, Analistas 25%, Crescimento 20%, Momentum 15%, Rendimento 10%). Exige pelo menos 3 fatores com dados.</p>
<h4>4. Análise completa</h4><p>As ${m.n_deep} melhores por score com capitalização ≥ ${m.deep_min_usd/1e9} mil milhões USD, mais as ações curadas, recebem dados detalhados: rácios, DCF, metas e consenso de analistas, notícias e risco.</p>
<h4>5. Metas e zona de compra</h4><p>Meta 1 = preço-alvo médio dos analistas. Meta 2 = DCF simples (fluxo de caixa livre a 10 anos, crescimento limitado a 8%, desconto 9%, só quando a moeda das demonstrações é a do preço). Preço justo = média das duas (o DCF só entra se estiver entre 0,5× e 2× o preço). Zona de compra = preço justo − 15%.</p>
<h4>6. Auditoria às contas (nova)</h4><p>Para cada análise completa lemos as demonstrações financeiras anuais (equivalentes aos 10-K) e calculamos o que os investidores institucionais usam: <b>Piotroski F</b> (9 testes de saúde financeira), <b>Altman Z</b> (risco de falência), <b>Beneish M</b> (sinais de manipulação de lucros), <b>ROIC vs custo de capital</b> (a empresa cria valor?), <b>P/E atual vs a sua própria história</b> e margens vs média própria (evita comprar no pico do ciclo), <b>DCF inverso</b> (que crescimento o preço atual já assume), e <b>revisões, dispersão e surpresas dos analistas</b>. A combinação dá uma nota de qualidade 0–100 e assinala possíveis <b>armadilhas de valor</b> (barata face à história, mas com margens em pico, contas fracas ou estimativas a cair). Bancos e seguradoras ficam de fora destas métricas. São heurísticas, não garantias.</p>
<h4>7. Risco e cenários</h4><p>Volatilidade, queda máxima, VaR 95%, beta face ao S&amp;P 500 e Sharpe calculados com 12 meses de preços. Os cenários usam um modelo lognormal com retorno esperado CAPM (${m.rf*100}% + beta × ${m.erp*100}%).</p>
<h4>Controlo de qualidade</h4><p>${qcText()}</p><h4>Limitações</h4><p>Os dados vêm do Yahoo Finance (gratuito, pode ter erros ou atrasos). Percentis só comparam com o universo acima, não com o mercado inteiro. Rácios de bancos e empresas com demonstrações noutra moeda podem ser menos fiáveis. Isto é informação, não aconselhamento financeiro. Atualizado em ${esc(D.updated)}.</p></div>`}

function tmx(it,x,y,w,h,o){if(it.length==1){o.push({...it[0],x,y,w,h});return}const tot=it.reduce((a,b)=>a+b.v,0);let acc=0,i=0;while(i<it.length-1&&acc+it[i].v<tot/2){acc+=it[i].v;i++}if(i==0)i=1;acc=it.slice(0,i).reduce((a,b)=>a+b.v,0);
if(w>=h){const wl=w*acc/tot;tmx(it.slice(0,i),x,y,wl,h,o);tmx(it.slice(i),x+wl,y,w-wl,h,o)}else{const hl_=h*acc/tot;tmx(it.slice(0,i),x,y,w,hl_,o);tmx(it.slice(i),x,y+hl_,w,h-hl_,o)}}
function market(){const rows=R.filter(r=>r.chg!=null&&(REG=='all'||(EXI[r.ex]||{}).r==REG)),top=rows.slice().sort((a,b)=>b.mcap-a.mcap).slice(0,64),W=900,H=520,o=[];
tmx(top.map(r=>({r,v:Math.sqrt(r.mcap)})),0,0,W,H,o);
const tiles=o.map(q=>{const c=q.r.chg,a=Math.min(1,Math.abs(c)/3),big=q.w>54&&q.h>34;return `<g data-k="${esc(q.r.s)}" style="cursor:pointer"><rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="var(--card2)" stroke="var(--bg)" stroke-width="2" rx="6"/><rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="var(--${c>=0?"up":"dn"})" fill-opacity="${(.14+.62*a).toFixed(2)}" stroke="var(--bg)" stroke-width="2" rx="6"/>${big?`<text x="${q.x+q.w/2}" y="${q.y+q.h/2-1}" text-anchor="middle" style="fill:var(--t1);font:700 ${Math.min(15,q.w/6)}px system-ui">${esc(q.r.s)}</text><text x="${q.x+q.w/2}" y="${q.y+q.h/2+14}" text-anchor="middle" style="fill:var(--t1);font:600 11px system-ui">${c>=0?"+":""}${c.toFixed(1)}%</text>`:""}</g>`}).join("");
const sec={};rows.forEach(r=>{const s=sec[r.sec]??={w:0,c:0,n:0};s.w+=r.mcap;s.c+=r.chg*r.mcap;s.n++});
const S=Object.entries(sec).map(([k,v])=>({k,c:v.c/v.w,n:v.n})).sort((a,b)=>b.c-a.c),mx=Math.max(1,...S.map(x=>Math.abs(x.c)));
const mv=(a)=>rows.filter(r=>r.mcap>=1e4).sort((x,y)=>a*(y.chg-x.chg)).slice(0,6).map(r=>`<div class="mv" data-k="${esc(r.s)}"><span><b>${esc(r.s)}</b> <span class="sub">${esc(r.name.slice(0,22))}</span></span><span>${sg(r.chg,1)}</span></div>`).join("");
const upN=rows.filter(r=>r.chg>0).length;
$("#mkt").innerHTML=`<div class="box"><h3>Mapa do dia · 64 maiores empresas (área ∝ √ capitalização)</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mapa de calor do mercado">${tiles}</svg><div class="cap">Verde = em alta, vermelho = em baixa. Intensidade máxima a ±3%. Toca numa empresa para abrir a análise.</div></div>
<div class="box"><h3>Amplitude do mercado</h3><div style="font-size:30px;font-weight:800;letter-spacing:-.03em">${rows.length?Math.round(100*upN/rows.length):0}% <span class="sub" style="font-size:14px;font-weight:500">em alta (${upN} de ${rows.length})</span></div>
<h3 style="margin-top:18px">Setores hoje (média ponderada)</h3>${S.map(x=>`<div class="sb"><span>${SECPT[x.k]||x.k}</span><div class="tr"><i style="${x.c>=0?"left:50%":"right:50%"};width:${(Math.abs(x.c)/mx*50).toFixed(1)}%;background:var(--${x.c>=0?"up":"dn"})"></i></div><b class="${x.c>=0?"up":"dn"}">${x.c>=0?"+":""}${x.c.toFixed(1)}%</b></div>`).join("")}
<h3 style="margin-top:18px">Maiores subidas</h3>${mv(1)}<h3 style="margin-top:18px">Maiores quedas</h3>${mv(-1)}</div>`}

function dec(b64){const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let i=0,id,px;const vi=()=>{let r=0,s=0,x;do{x=b[i++];r|=(x&127)<<s;s+=7}while(x&128&&i<b.length);return r};
while(i<b.length){const tag=vi(),fl=tag>>3,w=tag&7;if(w==0)vi();else if(w==1)i+=8;else if(w==5){if(fl==2)px=new DataView(b.buffer,i,4).getFloat32(0,true);i+=4}else if(w==2){const l=vi();if(fl==1)id=new TextDecoder().decode(b.slice(i,i+l));i+=l}else break}return[id,px]}

ws.onclose=()=>{live("a reconectar…");setTimeout(connect,Math.min(30000,1000*2**retry++))};ws.onerror=()=>ws.close()}
