<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal de Análise Fundamental</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#11151a;--line:#232a33;--line2:#2c3541;--t1:#d8dee6;--mut:#7d8794;--blue:#3987e5;--org:#d95926;--up:#3fb27f;--dn:#e5534b;--warn:#d9a441}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t1);font:12px/1.4 system-ui,"Segoe UI",sans-serif}
.m,td,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px 26px minmax(0,1fr);height:100vh;height:100dvh}
#tabs{display:none}
#bar{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar b{letter-spacing:.12em;font-size:11px}#cmd{background:var(--bg);border:1px solid var(--line2);color:var(--t1);padding:4px 8px;width:220px;font:12px ui-monospace,Consolas,monospace;outline:none}#cmd:focus{border-color:var(--blue)}
#live{margin-left:auto;color:var(--mut)}
#tape{scrollbar-width:none;display:flex;gap:18px;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;background:var(--bg)}#tape::-webkit-scrollbar{display:none}
#tape span.n{color:var(--mut);margin-right:5px}
#main{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(0,1.7fr) minmax(290px,.8fr);gap:1px;background:var(--line);min-height:0}
.pane{background:var(--bg);overflow:auto;min-height:0}
.ph{position:sticky;top:0;z-index:5;background:var(--panel);padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph button,.tabs button{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:2px 6px}
.ph button.on,.tabs button.on{color:var(--t1);box-shadow:inset 0 -2px var(--blue)}
.blk{padding:10px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:4px 5px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:29px;background:var(--bg);color:var(--mut);font-weight:500;cursor:pointer;font-size:10px;text-transform:uppercase;z-index:4}
th:first-child,td:first-child{text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel)}tr.sel{background:#3987e522}tr.sel td:first-child{box-shadow:inset 2px 0 var(--blue)}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--warn)}.mut{color:var(--mut)}
.filters{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
select,input.f{background:var(--bg);border:1px solid var(--line2);color:var(--t1);padding:3px 6px;font:11px system-ui}input.f{width:70px}
.hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tk{font-size:22px;font-weight:700;letter-spacing:.02em}.px{font-size:26px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line2);padding:1px 5px;margin-right:4px;color:var(--mut)}.tag.w{color:var(--warn);border-color:var(--warn)}.tag.g{color:var(--up);border-color:var(--up)}
.three{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px}@media(max-width:1300px){.three{grid-template-columns:1fr}}
.verdict{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7}.verdict div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line2)}
.pb{display:inline-block;width:44px;height:6px;background:var(--line);vertical-align:middle;margin-left:6px}.pb i{display:block;height:100%;background:var(--blue)}
.tip{border-bottom:1px dotted var(--mut);cursor:help;position:relative}.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:50;width:250px;white-space:normal;background:#000;border:1px solid var(--line2);color:var(--t1);padding:6px 8px;font:11px system-ui;text-transform:none;letter-spacing:0}
svg text{fill:var(--mut);font:10px ui-monospace,Consolas,monospace}
dl{margin:0}dt{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:8px}dd{margin:2px 0 0}
.news a{display:block;color:var(--t1);text-decoration:none;padding:5px 0;border-bottom:1px solid var(--line)}.news a:hover{color:var(--blue)}
#ctip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line2);padding:4px 7px;display:none;z-index:60;font:11px ui-monospace,Consolas,monospace}
details{padding:8px 10px}summary{cursor:pointer;color:var(--mut);text-transform:uppercase;font-size:10px;letter-spacing:.08em}details dt{color:var(--t1);text-transform:none;font-size:12px}details dd{color:var(--mut)}
@media(max-width:1100px){
#app{grid-template-rows:auto 26px 40px minmax(0,1fr)}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:600 12px system-ui;text-transform:uppercase;letter-spacing:.06em;padding:0}
#tabs button.on{color:var(--t1);border-bottom-color:var(--blue)}
#main{display:block;position:relative}.pane{display:none;height:100%}.pane.act{display:block}
#bar{flex-wrap:wrap;height:auto;min-height:34px;padding:4px 10px;gap:6px 10px}#bar b{display:none}#cmd{flex:1;min-width:0;width:auto}#live{margin-left:0;flex-basis:100%;font-size:10px}
.three{grid-template-columns:minmax(0,1fr)}.blk{overflow-x:auto}.kb{display:none}#p2 .three>div:first-child{max-width:260px;margin:0 auto;width:100%}.px{font-size:22px}.tk{font-size:18px}
.tip:hover::after,.tip:focus::after{width:200px}}
@media(max-width:600px){
#p1 th:nth-child(5),#p1 td:nth-child(5),#p1 th:nth-child(7),#p1 td:nth-child(7),#p1 th:nth-child(8),#p1 td:nth-child(8){display:none}
#p1 .pb{display:none}th,td{padding:7px 6px}select,input.f,#cmd{font-size:16px}}
</style></head><body><div id="app">
<div id="bar"><b>TERMINAL FUNDAMENTAL</b><input id="cmd" placeholder="Ticker ↵   ( / )" autocomplete="off" spellcheck="false"><span class="mut" id="cmdmsg"></span><span id="live">a ligar…</span></div>
<div id="tape"></div>
<div id="tabs"><button data-p="1" class="on">Ranking</button><button data-p="2">Ficha</button><button data-p="3">Mercado</button></div>
<div id="main">
 <section class="pane" id="p1"></section>
 <section class="pane" id="p2"></section>
 <section class="pane" id="p3"></section>
</div></div><div id="ctip"></div>
<script src="data.js"></script>
<script>
const D=window.DATA,T=D.tickers,TP=D.tape||{},$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(v,d=1,u="")=>v==null?"–":Number(v).toFixed(d)+u;
const chg=(v,d=1)=>v==null?"–":`<span class="${v>=0?"up":"dn"}">${v>=0?"▲":"▼"} ${Math.abs(v).toFixed(d)}%</span>`;
const big=v=>v>=1e12?(v/1e12).toFixed(2)+"T":v>=1e9?(v/1e9).toFixed(1)+"B":v>=1e6?(v/1e6).toFixed(0)+"M":f(v,0);
for(const k in T){const t=T[k];t.prev=t.d1!=null?t.price/(1+t.d1/100):t.price}
let sel=(location.hash.slice(1)||D.top10[0]),tab="top",sk="score",sd=-1,sector="",minS=0,rng="6M",hm="d1";
if(!T[sel])sel=D.top10[0];
const RN={"1M":22,"3M":64,"6M":127,"1A":9999};
// metricas: [chave,nome,unidade,explicação]
const M=[["fpe","P/E projetado","x","Preço ÷ lucro esperado no próximo ano. Quanto pagas por cada 1 $ de lucro. Compara com a mediana do setor."],
["eve","EV/EBITDA","x","Valor da empresa (com dívida) ÷ lucro operacional antes de amortizações. Neutro face à dívida."],
["fcfy","FCF yield","%","Fluxo de caixa livre ÷ valor de mercado. O caixa real gerado por cada 1 $ investido na ação."],
["om","Margem operacional","%","De cada 100 $ vendidos, quantos sobram como lucro do negócio. Mede poder de preço (moat)."],
["roe","ROE","%","Lucro ÷ capital próprio. Pode ser distorcido se o capital próprio for negativo ou muito pequeno."],
["nd","Dív. líq./EBITDA","x","Anos de lucro operacional necessários para pagar a dívida líquida. Acima de 4 é arriscado."],
["eg","Cresc. lucros","%","Variação dos lucros face ao período homólogo."],
["rg","Cresc. vendas","%","Variação das vendas face ao período homólogo."],
["dy","Dividendo","%","Dividendo anual ÷ preço."]];
const GL=[["P/E","Preço ÷ lucro por ação. Baixo = barato, mas uma empresa em declínio também tem P/E baixo."],["Margem de segurança","Diferença entre o preço e o valor estimado. Quanto maior, mais erro podes cometer sem perder dinheiro."],["Fluxo de caixa livre","Dinheiro que sobra depois de despesas e investimentos: paga dividendos, dívida e recompras."],["Moat","Vantagem duradoura sobre a concorrência: marca, escala, patentes, custos de mudança."],["Value trap","Ação barata porque o negócio está realmente a deteriorar-se. P/E baixo sozinho não chega."],["Percentil","Posição face às outras ações do ecrã (100 = melhor). Não é o mercado inteiro."]];

// ---------- fita
function tape(){$("#tape").innerHTML=Object.keys(TP).map(k=>{const q=TP[k],c=(q.price/q.prev-1)*100;return `<span class="m"><span class="n">${esc(D.tape_names[k])}</span><span data-tp="${k}">${f(q.price,q.price>1000?0:2)}</span> <span data-tc="${k}">${chg(c,2)}</span></span>`}).join("")}

// ---------- screener
function rows(){let ks=tab=="top"?D.top10.slice():Object.keys(T).filter(k=>(!sector||T[k].sector==sector)&&T[k].score>=minS);
if(tab!="top")ks.sort((a,b)=>{const x=sk=="k"?a:T[a][sk],y=sk=="k"?b:T[b][sk];return sd*((x??-1e9)>(y??-1e9)?1:-1)});return ks}
const COLS=[["k","Ticker"],["score","Score"],["price","Preço"],["d1","1D"],["m1","1M"],["upside","Upside"],["fpe","P/E f."],["dy","Div"]];
function screener(){const secs=[...new Set(Object.values(T).map(t=>t.sector).filter(Boolean))].sort();
$("#p1").innerHTML=`<div class="ph"><span class="tabs"><button class="${tab=="top"?"on":""}" data-t="top">Top 10</button><button class="${tab=="all"?"on":""}" data-t="all">Screener (${Object.keys(T).length})</button></span><span class="kb">↑↓ navegar</span></div>
${tab=="all"?`<div class="filters"><select id="fs"><option value="">Todos os setores</option>${secs.map(s=>`<option ${s==sector?"selected":""}>${esc(s)}</option>`).join("")}</select><input class="f" id="fm" type="number" placeholder="Score ≥" value="${minS||""}"></div>`:""}
<table><thead><tr>${COLS.map(([k,l])=>`<th data-k="${k}">${l}${k==sk&&tab=="all"?(sd>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>${rows().map(k=>{const t=T[k];return `<tr data-k="${k}" class="${k==sel?"sel":""}"><td><b>${k}</b></td><td>${t.score}<span class="pb"><i style="width:${t.score}%"></i></span></td><td data-px="${k}">${f(t.price,2)}</td><td data-d1="${k}">${chg(t.d1,2)}</td><td>${chg(t.m1)}</td><td data-up="${k}">${chg(t.upside,0)}</td><td>${f(t.fpe)}</td><td>${f(t.dy)}</td></tr>`}).join("")}</tbody></table>`}
$("#p1").onclick=e=>{const b=e.target.closest("[data-t]"),th=e.target.closest("th"),tr=e.target.closest("tbody tr");
if(b){tab=b.dataset.t;screener()}else if(th&&tab=="all"){sd=th.dataset.k==sk?-sd:-1;sk=th.dataset.k;screener()}else if(tr)pick(tr.dataset.k)};
$("#p1").onchange=e=>{if(e.target.id=="fs"){sector=e.target.value;screener()}if(e.target.id=="fm"){minS=+e.target.value||0;screener()}};
function showPane(n){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p==n));[1,2,3].forEach(i=>$("#p"+i).classList.toggle("act",i==n))}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-p]");if(b)showPane(b.dataset.p)};
function pick(k){sel=k;location.hash=k;screener();work();$("#p2").scrollTop=0;if(matchMedia("(max-width:1100px)").matches)showPane(2)}

// ---------- gráficos
const PW=()=>Math.min(700,($('#p2').clientWidth||innerWidth)-22);
function chart(t){let h=t.hist.slice(-RN[rng]-1);const W=PW(),H=250,m={l:44,r:84,t:8,b:20};
const pmin=Math.min(...h.map(x=>x[1])),pmax=Math.max(...h.map(x=>x[1]));
const L=[[t.high,"Máx 52s","var(--mut)"],[t.low,"Mín 52s","var(--mut)"],[t.target,"Alvo","var(--org)"],[t.dcf,"DCF","var(--blue)"]].filter(l=>l[0]&&l[0]>=pmin*.6&&l[0]<=pmax*1.6);
const vals=[pmin,pmax,...L.map(l=>l[0])],lo=Math.min(...vals)*.98,hi=Math.max(...vals)*1.02;
const x=i=>m.l+i/(h.length-1)*(W-m.l-m.r),y=v=>H-m.b-(v-lo)/(hi-lo)*(H-m.t-m.b),id="c"+Math.random().toString(36).slice(2,7);
let g=[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3;return `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-5}" y="${y(v)+3}" text-anchor="end">${v.toFixed(v>100?0:1)}</text>`}).join("");
g+=L.map(([v,l,c])=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="4 3"/><text x="${W-m.r+4}" y="${y(v)+3}" style="fill:${c}">${l} ${v.toFixed(0)}</text>`).join("");
g+=`<text x="${m.l}" y="${H-5}">${h[0][0]}</text><text x="${W-m.r}" y="${H-5}" text-anchor="end">${h.at(-1)[0]}</text>`;
g+=`<path d="${h.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(--blue)" stroke-width="1.6"/><line id="${id}" y1="${m.t}" y2="${H-m.b}" stroke="var(--mut)" display="none"/>`;
setTimeout(()=>{const s=document.getElementById(id)?.closest("svg");if(!s)return;s.style.touchAction='pan-y';s.onpointermove=e=>{const b=s.getBoundingClientRect(),i=Math.max(0,Math.min(h.length-1,Math.round(((e.clientX-b.left)*W/b.width-m.l)/(W-m.l-m.r)*(h.length-1))));const l=document.getElementById(id);l.setAttribute("x1",x(i));l.setAttribute("x2",x(i));l.removeAttribute("display");const c=$("#ctip");c.style.display="block";c.style.left=e.clientX+12+"px";c.style.top=e.clientY+12+"px";c.textContent=h[i][0]+"  "+h[i][1].toFixed(2)};
s.onpointerleave=()=>{$("#ctip").style.display="none";document.getElementById(id)?.setAttribute("display","none")}});
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Preço de ${esc(t.name)}">${g}</svg>`}
function radar(t){const N=["Valor","Cresc.","Rentab.","Saúde","Dividendo"],cx=100,cy=92,R=62,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
const poly=v=>v.map((x,i)=>pt(i,x).join(",")).join(" ");
return `<svg viewBox="-14 0 228 184" width="100%" role="img" aria-label="Perfil fundamental">${[25,50,75,100].map(q=>`<polygon points="${poly([q,q,q,q,q])}" fill="none" stroke="var(--line2)"/>`).join("")}
${N.map((n,i)=>{const[x,y]=pt(i,118);return `<text x="${x}" y="${y+3}" text-anchor="middle">${n} ${t.radar[i]}</text>`}).join("")}
<polygon points="${poly(t.radar)}" fill="#3987e544" stroke="var(--blue)" stroke-width="1.5"/></svg>`}
function football(t){const W=Math.min(520,PW()),m={l:78,r:20},rows=[["52 semanas",t.low,t.high,null],["Analistas",t.tlow,t.thigh,t.target],["DCF",null,null,t.dcf]];
const all=[t.price,t.low,t.high,t.tlow,t.thigh,t.target,t.dcf].filter(Boolean),lo=Math.min(...all)*.95,hi=Math.min(Math.max(...all)*1.05,t.price*2.6);
const x=v=>m.l+(Math.min(v,hi)-lo)/(hi-lo)*(W-m.l-m.r);
let g=rows.map(([l,a,b,mk],i)=>{const y=14+i*30;let s=`<text x="0" y="${y+9}">${l}</text>`;
if(a!=null&&b!=null)s+=`<rect x="${x(a)}" y="${y}" width="${Math.max(2,x(b)-x(a))}" height="12" fill="var(--line2)"/><text x="${x(a)}" y="${y+24}">${a.toFixed(0)}</text><text x="${x(b)}" y="${y+24}" text-anchor="end">${b>hi?"▶ ":""}${b.toFixed(0)}</text>`;
if(mk)s+=`<line x1="${x(mk)}" x2="${x(mk)}" y1="${y-2}" y2="${y+14}" stroke="var(--org)" stroke-width="2"/>`;
if(l=="DCF")s+=t.dcf?`<polygon points="${x(t.dcf)},${y-1} ${x(t.dcf)+7},${y+6} ${x(t.dcf)},${y+13} ${x(t.dcf)-7},${y+6}" fill="var(--blue)"/><text x="${x(t.dcf)>W*.6?x(t.dcf)-11:x(t.dcf)+11}" y="${y+10}" text-anchor="${x(t.dcf)>W*.6?"end":"start"}" style="fill:var(--t1)">${t.dcf>hi?"▶ ":""}${t.dcf.toFixed(0)} (g ${t.dcf_g}%, r 9%)</text>`:`<text x="${m.l}" y="${y+10}">n/d (FCF ≤ 0 ou setor financeiro)</text>`;
return s}).join("");
g+=`<line x1="${x(t.price)}" x2="${x(t.price)}" y1="4" y2="102" stroke="var(--t1)" stroke-dasharray="3 3"/><text x="${x(t.price)}" y="112" text-anchor="middle" style="fill:var(--t1)">preço ${t.price.toFixed(0)}</text>`;
return `<svg viewBox="0 0 ${W} 118" width="100%" role="img" aria-label="Intervalos de valor">${g}</svg><div class="mut" style="font-size:10px">Barra = intervalo · traço laranja = média analistas · losango = DCF próprio</div>`}

// ---------- ficha
function checks(t){return[["Lucros a crescer",t.eg==null?null:t.eg>=0,f(t.eg,1,"%")],["Margem operacional ≥ 8%",t.om==null?null:t.om>=8,f(t.om,1,"%")],["Dívida líq./EBITDA ≤ 4",t.nd==null?null:t.nd<=4,f(t.nd,1,"x")],["Fluxo de caixa positivo",t.fcfy==null?null:t.fcfy>0,f(t.fcfy,1,"% FCF yield")],["Alvo dos analistas > preço",t.upside==null?null:t.upside>0,f(t.upside,1,"%")]]}
function work(){const t=T[sel],th=t.thesis||["–","–","–"],mos=t.dcf?(t.dcf/t.price-1)*100:null;
const why=[t.drawdown<=-10?`${Math.abs(t.drawdown).toFixed(0)}% abaixo do máximo de 52 semanas (${t.high}).`:`Perto do máximo de 52 semanas: não está em desconto face ao próprio histórico.`,
t.upside!=null?(t.upside>0?`${t.analysts||"?"} analistas: alvo médio ${t.target} (${t.upside.toFixed(0)}% acima).`:`Preço acima do alvo médio dos analistas (${t.target}).`):"",
t.trap.length?`<span class="wn">Sinais de alerta: ${t.trap.join(", ")}. Pode ser value trap.</span>`:(t.cheap?"Os números do negócio não mostram deterioração; confirma a causa da queda nas notícias.":"Sem desconto relevante pelos números.")].filter(Boolean).join(" ");
$("#p2").innerHTML=`<div class="ph"><span>Ficha · ${sel}</span><span class="tabs">${Object.keys(RN).map(r=>`<button class="${r==rng?"on":""}" data-r="${r}">${r}</button>`).join("")}</span></div>
<div class="blk"><div class="hd"><div><span class="tk">${sel}</span> <span class="mut">${esc(t.name)}</span><div class="mut">${esc(t.sector||"")} · ${esc(t.industry||"")} · cap. ${big(t.mcap||0)}</div>
<div style="margin-top:4px">${t.badges.map(b=>`<span class="tag ${b[1]=="warn"?"w":b[1]=="good"?"g":""}">${esc(b[0].replace("⚠ ",""))}</span>`).join("")}</div></div>
<div style="text-align:right"><div class="px num"><span data-px="${sel}">${f(t.price,2)}</span></div><div class="num" data-d1="${sel}">${chg(t.d1,2)}</div><div class="mut">€ ${D.eurusd?(t.price/D.eurusd).toFixed(2):"–"} · ${esc(t.rec||"–")}</div></div></div></div>
<div class="blk">${chart(t)}</div>
<div class="blk three"><div>${radar(t)}</div><div>
 <div class="verdict">
 <div><span>Score fundamental</span><b>${t.score}/100</b></div>
 <div><span>Valor · Rent. · Solv. · Cresc.</span><span>${t.pillars.join(" · ")} (de 25)</span></div>
 <div><span class="tip" tabindex="0" data-tip="Valor do DCF próprio vs preço. Positivo = ação abaixo do valor estimado. Depende fortemente das premissas (g, r).">Margem seg. DCF</span><span data-mos>${chg(mos,0)}</span></div>
 <div><span>Upside alvo analistas</span><span data-up="${sel}">${chg(t.upside,0)}</span></div>

// ---------- heatmap (área ∝ √cap, cor = variação)
function tm(it,x,y,w,h,o){if(it.length==1){o.push({...it[0],x,y,w,h});return}const tot=it.reduce((a,b)=>a+b.v,0);let acc=0,i=0;while(i<it.length-1&&acc+it[i].v<tot/2){acc+=it[i].v;i++}if(i==0)i=1;acc=it.slice(0,i).reduce((a,b)=>a+b.v,0);
if(w>=h){const wl=w*acc/tot;tm(it.slice(0,i),x,y,wl,h,o);tm(it.slice(i),x+wl,y,w-wl,h,o)}else{const hl=h*acc/tot;tm(it.slice(0,i),x,y,w,hl,o);tm(it.slice(i),x,y+hl,w,h-hl,o)}}
function col(v,s){if(v==null)return"#2c3541";const a=Math.min(1,Math.abs(v)/s);const c=v>=0?[63,178,127]:[229,83,75],g=[44,53,65];return `rgb(${g.map((q,i)=>Math.round(q+(c[i]-q)*a)).join(",")})`}
function heat(){const W=320,H=300,bySec={};for(const k in T){const t=T[k];(bySec[t.sector||"Outros"]??=[]).push({k,v:Math.sqrt(t.mcap||1e9),c:t[hm]})}
const secs=Object.entries(bySec).map(([s,a])=>({s,v:a.reduce((x,y)=>x+y.v,0),a:a.sort((x,y)=>y.v-x.v)})).sort((a,b)=>b.v-a.v),o=[];tm(secs,0,0,W,H,o);
const sc=hm=="d1"?4:25;let g="";for(const S of o){const r=[];tm(S.a,S.x,S.y,S.w,S.h,r);
g+=r.map(q=>`<g data-hk="${q.k}" style="cursor:pointer"><rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${col(q.c,sc)}" stroke="var(--bg)" stroke-width="1"/>${q.w>34&&q.h>22?`<text x="${q.x+q.w/2}" y="${q.y+q.h/2}" text-anchor="middle" style="fill:#fff;font-weight:700">${q.k}</text><text x="${q.x+q.w/2}" y="${q.y+q.h/2+11}" text-anchor="middle" style="fill:#fff">${q.c==null?"":(q.c>=0?"+":"")+q.c.toFixed(1)+"%"}</text>`:""}</g>`).join("");
g+=`<rect x="${S.x}" y="${S.y}" width="${S.w}" height="${S.h}" fill="none" stroke="var(--bg)" stroke-width="2"/>${S.w>60?`<text x="${S.x+3}" y="${S.y+9}" style="fill:#ffffffb0;font-size:8px">${esc(S.s.toUpperCase().slice(0,20))}</text>`:""}`}
const e=document.getElementById("hm");if(e)e.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mapa de calor por setor">${g}</svg>`}
function side(){const ks=Object.keys(T),mv=(a)=>ks.filter(k=>T[k].d1!=null).sort((x,y)=>a*(T[y].d1-T[x].d1)).slice(0,5);
const L=(a)=>a.map(k=>`<tr data-k="${k}"><td><b>${k}</b></td><td data-px="${k}">${f(T[k].price,2)}</td><td data-d1="${k}">${chg(T[k].d1,2)}</td></tr>`).join("");
$("#p3").innerHTML=`<div class="ph"><span>Mapa de calor</span><span class="tabs"><button class="${hm=="d1"?"on":""}" data-h="d1">1D</button><button class="${hm=="m1"?"on":""}" data-h="m1">1M</button></span></div>
<div class="blk" id="hm"></div><div class="mut" style="padding:0 10px 8px;font-size:10px">Área ∝ √(capitalização) · cor = variação ${hm=="d1"?"(±4%)":"(±25%)"}</div>
<div class="ph">Maiores subidas hoje</div><table><tbody>${L(mv(1))}</tbody></table><div class="ph">Maiores quedas hoje</div><table><tbody>${L(mv(-1))}</tbody></table>
<details><summary>Glossário</summary><dl>${GL.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></details>

// ---------- tempo real (Yahoo, não oficial)
let ws,retry=0,last=0,hmT;const live=m=>$("#live").textContent=m;
function paint(s,p){if(TP[s]){const q=TP[s];q.price=p;document.querySelectorAll(`[data-tp="${s}"]`).forEach(e=>e.textContent=f(p,p>1000?0:2));document.querySelectorAll(`[data-tc="${s}"]`).forEach(e=>e.innerHTML=chg((p/q.prev-1)*100,2));return}
const t=T[s];if(!t)return;t.price=p;t.d1=(p/t.prev-1)*100;if(t.target)t.upside=(t.target/p-1)*100;
document.querySelectorAll(`[data-px="${s}"]`).forEach(e=>{e.textContent=f(p,2);e.style.background="#3987e533";setTimeout(()=>e.style.background="",250)});
document.querySelectorAll(`[data-d1="${s}"]`).forEach(e=>e.innerHTML=chg(t.d1,2));document.querySelectorAll(`[data-up="${s}"]`).forEach(e=>e.innerHTML=chg(t.upside,0));
if(s==sel){const m=document.querySelector("[data-mos]");if(m&&t.dcf)m.innerHTML=chg((t.dcf/p-1)*100,0)}
if(hm=="d1"&&!hmT)hmT=setTimeout(()=>{hmT=0;heat()},4000)}
function dec(b64){const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let i=0,id,px;const vi=()=>{let r=0,s=0,x;do{x=b[i++];r|=(x&127)<<s;s+=7}while(x&128&&i<b.length);return r};
while(i<b.length){const tag=vi(),fl=tag>>3,w=tag&7;if(w==0)vi();else if(w==1)i+=8;else if(w==5){if(fl==2)px=new DataView(b.buffer,i,4).getFloat32(0,true);i+=4}else if(w==2){const l=vi();if(fl==1)id=new TextDecoder().decode(b.slice(i,i+l));i+=l}else break}return[id,px]}
function connect(){ws=new WebSocket("wss://streamer.finance.yahoo.com/?version=2");
ws.onopen=()=>{retry=0;live("ligado · à espera de negócios");ws.send(JSON.stringify({subscribe:[...Object.keys(T),...Object.keys(TP)]}))};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type!="pricing")return;const[id,px]=dec(m.message);if(id&&px>0){paint(id,px);last=Date.now();live("● TEMPO REAL · Yahoo · "+new Date().toLocaleTimeString("pt-PT"))}}catch(_){}};
ws.onclose=()=>{live("a reconectar…");setTimeout(connect,Math.min(30000,1000*2**retry++))};ws.onerror=()=>ws.close()}
setInterval(()=>{if(last&&Date.now()-last>90000)live("sem negócios há >90 s (mercado fechado?)")},15000);

tape();screener();work();side();showPane(1);addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(work,200)});connect();
